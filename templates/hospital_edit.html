<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Rumah Sakit - Health System Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">HS</div>
                <h1>Health System</h1>
            </div>
            <div class="user-menu">
                <a href="/dashboard">Dashboard</a>
                <a href="/hospitals">Rumah Sakit</a>
                <a href="/">Dokter</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </div>
</header>

<div class="main-content">
    <div class="container">

        <div class="page-header">
            <h2>Edit Rumah Sakit</h2>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <div class="card">

            <!-- FORM EDIT -->
            <form method="post">

                <div class="form-group">
                    <label for="name">Nama Rumah Sakit</label>
                    <input type="text" id="name" name="name" 
                        class="form-control" 
                        value="{{ hospital.attributes.name }}" required>
                </div>

                <div class="form-group">
                    <label for="unit">Unit</label>
                    <select name="unit" id="unit" class="form-control" required>
                        <option value="">-- Pilih Unit --</option>
                        <option value="A" {% if hospital.attributes.unit == "A" %}selected{% endif %}>Unit A</option>
                        <option value="B" {% if hospital.attributes.unit == "B" %}selected{% endif %}>Unit B</option>
                        <option value="C" {% if hospital.attributes.unit == "C" %}selected{% endif %}>Unit C</option>
                        <option value="D" {% if hospital.attributes.unit == "D" %}selected{% endif %}>Unit D</option>
                        <option value="E" {% if hospital.attributes.unit == "E" %}selected{% endif %}>Unit E</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Alamat</label>
                    <input type="text" id="address" name="address" 
                        class="form-control" 
                        value="{{ hospital.attributes.address }}">
                </div>

                <div class="form-group">
                    <label for="phone">No. Telepon</label>
                    <input type="text" id="phone" name="phone" 
                        class="form-control" 
                        value="{{ hospital.attributes.phone }}">
                </div>

                <div class="form-group">
                    <label for="description">Deskripsi</label>
                    <textarea id="description" name="description"
                        class="form-control">{{ hospital.attributes.description }}</textarea>
                </div>

                <button type="submit" class="btn-primary">Update</button>

            </form>
        </div>

    </div>
</div>

</body>
</html>
