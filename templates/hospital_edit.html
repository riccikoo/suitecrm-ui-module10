<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Rumah Sakit</title>

    <style>
        body { background: #f5f5f5; font-family: Arial; }
        .container { max-width: 700px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; }
        h2 { color: #096B68; margin-bottom: 20px; }
        label { font-weight: bold; margin-top: 15px; display: block; }
        input, select, textarea {
            width: 100%; padding: 12px; margin-top: 5px;
            border: 1px solid #ddd; border-radius: 5px;
        }
        button {
            background: #129990; color: white;
            padding: 12px 20px; border: none;
            margin-top: 20px; width: 100%;
            border-radius: 5px; cursor: pointer;
        }
        button:hover { background: #096B68; }
    </style>
</head>

<body>
    <div class="container">
        <h2>Edit Rumah Sakit</h2>

        <form method="POST">

            <label>Nama Rumah Sakit</label>
            <input type="text" name="name" value="{{ hospital.attributes.name }}" required>

            <label>Unit</label>
            <select name="unit" required>
                {% set selected_unit = hospital.attributes.unit %}
                {% for u in ['A','B','C','D','E'] %}
                    <option value="{{ u }}" {% if selected_unit == u %}selected{% endif %}>{{ u }}</option>
                {% endfor %}
            </select>

            <label>Alamat</label>
            <input type="text" name="address" value="{{ hospital.attributes.address }}">

            <label>No. Telepon</label>
            <input type="text" name="phone" value="{{ hospital.attributes.phone }}">

            <label>Deskripsi</label>
            <textarea name="description">{{ hospital.attributes.description }}</textarea>

            <button type="submit">Simpan Perubahan</button>
        </form>
    </div>
</body>
</html>
