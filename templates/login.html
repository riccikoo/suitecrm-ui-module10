<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Health System Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <h1>Health System Suite</h1>
            <p>Sistem manajemen rumah sakit terintegrasi untuk meningkatkan efisiensi dan kualitas layanan kesehatan.</p>
        </div>
        <div class="login-right">
            <div class="login-form">
                <h2>Login SuiteCRM</h2>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% for category, message in messages %}
                    <div class="alert alert-{{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>
                  {% endfor %}
                {% endwith %}
                
                <form method="post">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    
                    <button type="submit" class="btn-primary">Login</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
