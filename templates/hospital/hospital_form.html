<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Rumah Sakit - Health System Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">HS</div>
                    <h1>Health System</h1>
                </div>
                <div class="user-menu">
                    <a href="/">Dashboard</a>
                    <a href="/hospitals">Rumah Sakit</a>
                    <a href="/doctors">Dokter</a>
                    <a href="/logout">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div class="container">

            <div class="page-header">
                <h2>Tambah Rumah Sakit</h2>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for category, message in messages %}
                <div class="alert alert-{{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>
              {% endfor %}
            {% endwith %}

            <div class="card">
                <form method="post">

                    <div class="form-group">
                        <label for="name">Nama Rumah Sakit</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="unit">Unit</label>
                        <select name="unit" id="unit" class="form-control" required>
                            <option value="">-- Pilih Unit --</option>
                            <option value="A">Unit A</option>
                            <option value="B">Unit B</option>
                            <option value="C">Unit C</option>
                            <option value="D">Unit D</option>
                            <option value="E">Unit E</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="address">Alamat</label>
                        <input type="text" id="address" name="address" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="phone">No. Telepon</label>
                        <input type="text" id="phone" name="phone" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="description">Deskripsi</label>
                        <textarea id="description" name="description" class="form-control"></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Submit</button>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
